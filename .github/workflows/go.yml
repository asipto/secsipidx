name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: "1.26"

    - name: Test
      run: GO_TEST_ALL=on go test -v ./...
