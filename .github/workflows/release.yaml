name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and upload assets for
        required: true
        type: string

permissions:
  contents: write

jobs:
  releases-matrix:
    name: Release Go Binary (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: ["386", amd64, arm64]
        exclude:
          - goos: darwin
            goarch: "386"
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        id: package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          binary_name="secsipidx"
          if [ "$GOOS" = "windows" ]; then
            binary_name="${binary_name}.exe"
          fi

          package_dir="dist/package"
          archive_base="secsipidx-${RELEASE_TAG}-${GOOS}-${GOARCH}"
          mkdir -p "$package_dir"

          go build -trimpath -ldflags="-s -w" -o "$package_dir/$binary_name" .
          cp LICENSE README.md secsipidx.1 "$package_dir/"

          if [ "$GOOS" = "windows" ]; then
            archive="dist/${archive_base}.zip"
            (cd "$package_dir" && zip -q -r "../../$archive" .)
          else
            archive="dist/${archive_base}.tar.gz"
            tar -C "$package_dir" -czf "$archive" .
          fi

          echo "asset=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ github.event.release.tag_name || inputs.release_tag }}"
          "${{ steps.package.outputs.asset }}" --clobber
